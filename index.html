<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HÜTTENKLANG – Nicht ganz normal</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#49301d,#17110e 65%);color:#f6e8d4;font:16px system-ui,sans-serif}main{max-width:800px;margin:auto;padding:32px 18px 100px}header{text-align:center}h1{font-size:clamp(32px,7vw,64px);letter-spacing:3px;margin:8px 0;color:#f4b46b;text-shadow:0 2px 25px #8b4b1b}h2{font-size:22px}p,.muted{color:#c5ad96}.cover{width:min(320px,85vw);aspect-ratio:1;object-fit:cover;border-radius:20px;box-shadow:0 16px 50px #0009;margin:12px auto;display:block}.panel{background:#2b201a;border:1px solid #65472e;border-radius:18px;padding:20px;margin-top:24px}button{cursor:pointer;background:#4a3225;border:1px solid #806044;color:#fff0d9;border-radius:12px;padding:12px 16px;font:inherit}button:hover,button.active{background:#ad672e;color:#fff}button:focus-visible{outline:3px solid #e4a66d}.controls{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.controls button{font-size:22px}.seek{width:100%;accent-color:#e5a267;margin:18px 0 4px}.time{display:flex;justify-content:space-between;color:#c8b29e;font-size:12px}.song{width:100%;display:flex;align-items:center;gap:14px;text-align:left;margin:7px 0;background:#35271e}.song.active{border-color:#edb06b;background:#5c3923}.song .n{color:#c49b76;width:25px}.song .name{flex:1}a{color:#f4b46b}footer{text-align:center;padding-top:22px;color:#bda38e;font-size:13px}
</style></head><body><main><header><img class="cover" src="cover.jpg" alt="Hüttenklang Logo"><h1>HÜTTENKLANG</h1><p>NICHT GANZ NORMAL · Das Album · 2026</p></header>
<section class="panel"><h2 id="now">Grillhütte</h2><p class="muted">Hüttenklang</p><audio id="audio" preload="metadata"></audio><input id="seek" class="seek" type="range" min="0" max="1000" value="0" aria-label="Position"><div class="time"><span id="elapsed">0:00</span><span id="duration">0:00</span></div><div class="controls"><button id="shuffle" title="Zufallswiedergabe" aria-label="Zufall">🔀</button><button id="prev" aria-label="Vorheriger Song">⏮</button><button id="play" aria-label="Abspielen">▶</button><button id="next" aria-label="Nächster Song">⏭</button><button id="repeat" title="Wiederholung: Album" aria-label="Wiederholen">🔁</button></div><p style="text-align:center"><a id="download" href="audio/01.m4a" download>Aktuellen Song herunterladen</a></p><p id="error" class="muted" role="status"></p></section>
<section class="panel"><h2>Alle Songs</h2><div id="list"></div></section><footer>HÜTTENKLANG · Musik für unsere Leute 🍻</footer></main>
<script>
const songs=["Grillhütte","Völlig durch","Jetzt erst recht","Der Pegel stimmt","Wer hat die Hosen an?","Wir sind nicht normal","Freunde wie wir!"];
const audio=document.querySelector("#audio"),play=document.querySelector("#play"),seek=document.querySelector("#seek"),list=document.querySelector("#list");let current=0,shuffle=false,repeat="all";
function fmt(s){return Number.isFinite(s)?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"0:00"}
function render(){list.replaceChildren();songs.forEach((s,i)=>{let b=document.createElement("button");b.className="song"+(i===current?" active":"");b.innerHTML='<span class="n">'+String(i+1).padStart(2,"0")+'</span><span class="name"></span><span>▶</span>';b.querySelector(".name").textContent=s;b.onclick=()=>load(i,true);list.append(b)})}
function load(i,autoplay=false){current=(i+songs.length)%songs.length;audio.src="audio/"+String(current+1).padStart(2,"0")+".m4a";document.querySelector("#now").textContent=songs[current];document.querySelector("#download").href=audio.src;document.querySelector("#error").textContent="";seek.value=0;render();if(autoplay)audio.play().catch(()=>{})}
function advance(dir){if(shuffle&&dir>0&&songs.length>1){let n;do{n=Math.floor(Math.random()*songs.length)}while(n===current);load(n,true)}else load(current+dir,true)}
play.onclick=()=>audio.paused?audio.play().catch(()=>{}):audio.pause();audio.onplay=()=>play.textContent="⏸";audio.onpause=()=>play.textContent="▶";document.querySelector("#prev").onclick=()=>advance(-1);document.querySelector("#next").onclick=()=>advance(1);
document.querySelector("#shuffle").onclick=e=>{shuffle=!shuffle;e.currentTarget.classList.toggle("active",shuffle);e.currentTarget.setAttribute("aria-pressed",shuffle)};
document.querySelector("#repeat").onclick=e=>{repeat=repeat==="all"?"one":repeat==="one"?"off":"all";e.currentTarget.textContent=repeat==="one"?"🔂":repeat==="off"?"➡️":"🔁";e.currentTarget.title="Wiederholung: "+repeat;e.currentTarget.classList.toggle("active",repeat!=="off")};
audio.ontimeupdate=()=>{seek.value=audio.duration?Math.round(audio.currentTime/audio.duration*1000):0;document.querySelector("#elapsed").textContent=fmt(audio.currentTime);document.querySelector("#duration").textContent=fmt(audio.duration)};
seek.oninput=()=>{if(audio.duration)audio.currentTime=seek.value/1000*audio.duration};
audio.onended=()=>{if(repeat==="one"){audio.currentTime=0;audio.play()}else if(repeat==="all"||current<songs.length-1)advance(1)};
audio.onerror=()=>{document.querySelector("#error").textContent="Audiodatei noch nicht hochgeladen oder nicht erreichbar."};load(0);
</script></body></html>
